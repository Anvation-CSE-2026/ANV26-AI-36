services:
  - type: web
    name: carelens-ai
    runtime: python
    plan: starter
    rootDir: carelens-ai
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --workers 1 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /welcome
    disk:
      name: carelens-data
      mountPath: /opt/render/project/src/carelens-ai/backend/instance
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FAMILY_COOKIE_SECURE
        value: "1"
